---
site_vlans:
  - vlan_id: 10
    name: HQ-USERS
  - vlan_id: 20
    name: HQ-VOICE
  - vlan_id: 99
    name: MANAGEMENT
  - vlan_id: 999
    name: BLACKHOLE
l2_interfaces:
  - name: GigabitEthernet0/0
    mode: trunk
    trunk:
      allowed_vlans: 10,20,99
      native_vlan: 999
      encapsulation: dot1q

  - name: GigabitEthernet0/1
    mode: access
    access:
      vlan: 10
    voice:
      vlan: 20

  - name: GigabitEthernet0/2
    mode: access
    access:
      vlan: 10
    voice:
      vlan: 20

  - name: GigabitEthernet0/3
    mode: access
    access:
      vlan: 999
